; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103RD]
platform = ststm32
board = genericSTM32F103RD
framework = stm32cube
board_build.ldscript = ldscripts/STM32F103RDTX_LOGGER.ld
build_src_filter = +<*> -<bluepill_main.c>
extra_scripts = post:tools/platformio_verify.py

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.f_cpu = 64000000L
board_build.ldscript = ldscripts/STM32F103C8TX_LOGGER.ld
build_src_filter = +<*> -<main.c>
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = post:tools/platformio_verify.py
