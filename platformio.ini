; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; STM32F103RDT6 compile example: src/main.c uses volatile RAM storage.
; The illustrative production linker reservation is retained for verification;
; this example does not write internal flash.
[env:genericSTM32F103RD]
platform = ststm32
board = genericSTM32F103RD
framework = stm32cube
board_build.ldscript = ldscripts/STM32F103RDTX_LOGGER.ld
build_src_filter = +<*> -<bluepill_main.c>
extra_scripts = post:tools/platformio_verify.py

; STM32F103C8T6 hardware test: src/bluepill_main.c uses the final nominal
; 8 KiB of the first 64 KiB of internal flash. Building does not upload it.
; Review/export existing logger data before programming a board.
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.f_cpu = 64000000L
board_build.ldscript = ldscripts/STM32F103C8TX_LOGGER.ld
build_src_filter = +<*> -<main.c>
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = post:tools/platformio_verify.py
